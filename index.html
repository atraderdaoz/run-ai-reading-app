<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUN.AI Reading Engine – AI Generator Mode</title>
<style>
body { margin:0; font-family:Arial; background:#0d0f1a; color:#fff; }
.container { padding:20px; max-width:900px; margin:auto; }
.card { background:#1a1d2e; padding:20px; border-radius:16px; }
button { padding:12px 18px; margin:6px; border:none; border-radius:10px; cursor:pointer; }
.primary { background:#4CAF50; color:white; }
img { width:100%; max-height:260px; object-fit:contain; margin:12px 0; border-radius:14px; background:#fff; }
.score { margin-bottom:10px; }
</style>
</head>
<body>
<div class="container">
<h1>🧠 Sam I Am – AI Infinite Reading Engine</h1>
<p class="score">Score: <span id="score">0</span></p>

<div class="card">
  <h2 id="question"></h2>
  <img id="image" src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
  <input id="input" placeholder="Type answer" style="padding:10px;">
  <br>
  <button class="primary" onclick="submitAnswer()">Submit</button>
  <p id="feedback"></p>
</div>

<div>
<button onclick="next()">Next ➡</button>
</div>

</div>

<script>
let score = 0;
let currentWord = '';

// Word bank (can expand infinitely later)
const wordBank = [
  "cat","dog","map","hat","bat","sun","fish","run","book","star",
  "pen","cup","tree","car","bed","milk","shoe","ball","moon","duck"
];

function generateQuestion(){
  currentWord = wordBank[Math.floor(Math.random() * wordBank.length)];
  let spaced = currentWord.split('').join('-');
  document.getElementById('question').innerText = spaced + ' = ?';
  document.getElementById('input').value = '';
  document.getElementById('feedback').innerText = '';
}

function submitAnswer(){
  let val = document.getElementById('input').value.toLowerCase();
  if(val === currentWord){
    score += 10;
    document.getElementById('feedback').innerText = '✅ Correct!';
  } else {
    document.getElementById('feedback').innerText = '❌ Try again (' + currentWord + ')';
  }
  document.getElementById('score').innerText = score;
}

function next(){
  generateQuestion();
}

// INIT
generateQuestion();
</script>

</body>
</html>
